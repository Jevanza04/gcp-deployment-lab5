name: Deploy to Google Cloud Storage

on:
  push:
    branches:
      - main  # Runs the workflow when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Install Google Cloud SDK
        run: |
          sudo apt-get update && sudo apt-get install -y google-cloud-sdk

      - name: Create Public Directory & Move Files
        run: |
          mkdir -p public
          mv index.html public/index.html  # Move the index.html file to public folder
          mv assets public/assets  # Move the assets folder (if any)
          
      - name: Upload Files to GCP Storage Bucket
        run: |
          gsutil -m rsync -R public gs://it718lab3-triple-grove-449216-p6

      - name: Make Files Public
        run: |
          gsutil -m acl ch -r -u AllUsers:R gs://it718lab3-triple-grove-449216-p6

      - name: Verify Deployment
        run: |
          echo "Website deployed at: https://storage.googleapis.com/it718lab3-triple-grove-449216-p6/index.html"
