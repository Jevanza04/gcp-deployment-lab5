name: Deploy to GCP Storage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Upload to GCP Storage
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set GCP Project
        run: gcloud config set project triple-grove-449216-p6

      - name: Install Google Cloud SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates gnupg curl
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
          sudo apt-get update && sudo apt-get install -y google-cloud-sdk

      - name: Create Public Directory & Move Files
        run: |
          mkdir -p public
          mv index.html public/  # Move the index.html to public folder

      - name: Authenticate with Service Account
        run: gcloud auth activate-service-account --key-file=${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Upload Files to GCP Storage Bucket
        run: |
          gsutil -m rsync -R public gs://it718lab3-triple-grove-449216-p6

      - name: Verify Deployment
        run: echo "Website deployed to: https://storage.googleapis.com/it718lab3-triple-grove-449216-p6/index.html"