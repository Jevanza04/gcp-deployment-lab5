name: Deploy to Google Cloud Storage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Install Google Cloud CLI
        run: |
          sudo apt-get update && sudo apt-get install -y google-cloud-cli

      - name: Create Public Directory & Move Files
        run: |
          mkdir -p public
          mv index.html public/index.html  # Move index.html
          if [ -d "assets" ]; then mv assets public/assets; fi

      - name: Upload Files to GCP Storage Bucket
        run: |
          gsutil -m rsync -R public gs://it718lab3-triple-grove-449216-p6

      - name: Make Files Public
        run: |
          gsutil -m acl ch -r -u AllUsers:R gs://it718lab3-triple-grove-449216-p6

      - name: Verify Deployment
        run: |
          echo "Website deployed at: https://storage.googleapis.com/it718lab3-triple-grove-449216-p6/index.html"
